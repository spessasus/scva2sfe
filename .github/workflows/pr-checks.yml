# The source build of README.md: the bake renderer's WebAssembly with the pinned Emscripten, the type checks (Node and
# browser-only) and the compiled converter. npm ci brings spessasynth_core from npm.
name: PR checks

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    EMSDK_VERSION: 6.0.13

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  path: scva2sfe

            - uses: actions/setup-node@v7
              with:
                  node-version: 26
                  cache: npm
                  cache-dependency-path: scva2sfe/package-lock.json

            - name: Cache the emsdk
              uses: actions/cache@v6
              with:
                  path: emsdk
                  key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}

            - name: Install Emscripten ${{ env.EMSDK_VERSION }}
              run: |
                  [ -d emsdk ] || git clone --depth 1 https://github.com/emscripten-core/emsdk.git
                  cd emsdk
                  ./emsdk install "$EMSDK_VERSION"
                  ./emsdk activate "$EMSDK_VERSION"

            - name: Install
              working-directory: scva2sfe
              run: npm ci

            - name: Build the bake renderer
              working-directory: scva2sfe
              env:
                  SCVA_EMSDK: ${{ github.workspace }}/emsdk
              run: npm run build:wasm

            - name: Type check
              working-directory: scva2sfe
              run: npm run build

            - name: Compiled converter
              working-directory: scva2sfe
              run: npm run build:dist

            - name: Web converter
              working-directory: scva2sfe
              run: npm run build:web

            # the licenses and the BSD notice travel with the compiled converter
            - uses: actions/upload-artifact@v7
              with:
                  name: scva2sfe-dist
                  path: |
                      scva2sfe/dist
                      scva2sfe/LICENSE
                      scva2sfe/LICENSE.NativeTS
                      scva2sfe/NOTICE.md
